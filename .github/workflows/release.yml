name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/deploy-vps.yml'
              - '.github/workflows/windows-test-suite.yml'

  test:
    needs: changes
    if: |
      needs.changes.outputs.release == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request'
    uses: ./.github/workflows/windows-test-suite.yml

  verify-docker:
    needs: changes
    if: |
      needs.changes.outputs.release == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose config
        run: |
          export MYSQL_PASSWORD=test-pass
          export MYSQL_ROOT_PASSWORD=test-root
          export SITE_ADDRESS=":80"
          docker compose config

  release:
    needs: [test, verify-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          VERSION=$(grep -E '^version = ' backend/pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG != pyproject version $VERSION"
            exit 1
          fi
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy-vps:
    needs: [test, verify-docker, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          TCGTOOLS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 45m
          envs: DEPLOY_REF,TCGTOOLS_DEPLOY_PATH
          script: |
            cd "${TCGTOOLS_DEPLOY_PATH:-/opt/tcg_tools}"
            ./deploy/vps-deploy.sh
