name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release:
              - 'backend/**'
              - 'frontend/**'
              - 'launcher/**'
              - 'scripts/**'
              - '.github/workflows/release.yml'
              - '.github/workflows/windows-test-suite.yml'

  test:
    needs: changes
    if: |
      needs.changes.outputs.release == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request'
    uses: ./.github/workflows/windows-test-suite.yml

  build:
    needs: [changes, test]
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        needs.changes.outputs.release == 'true'
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cache Python embed zip
        uses: actions/cache@v4
        with:
          path: dist/python-embed.zip
          key: python-embed-3.13.0-${{ runner.os }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build release
        shell: pwsh
        run: |
          ./scripts/validate-prod-lock.ps1
          ./scripts/build-release.ps1 -SkipTests
      - name: Smoke test staging
        shell: pwsh
        run: ./scripts/test-staging.ps1
      - name: Resolve artifact name
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -match '^refs/tags/v') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/v',''
            if ($tag -ne $version) { throw "Tag v$tag != pyproject version $version" }
            echo "name=TCGTools-$version-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -eq 'refs/heads/master') {
            echo "name=TCGTools-$version-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=false" >> $env:GITHUB_OUTPUT
          } else {
            $branch = $env:GITHUB_REF -replace 'refs/heads/','' -replace '/','-'
            $sha = $env:GITHUB_SHA.Substring(0,7)
            echo "name=TCGTools-$branch-$sha-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=false" >> $env:GITHUB_OUTPUT
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/TCGTools-*-setup.exe
      - name: GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TCGTools-*-setup.exe
          generate_release_notes: true
