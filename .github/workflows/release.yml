name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Backend tests
        working-directory: backend
        run: |
          py -3.13 -m pip install -e ".[dev]"
          py -3.13 -m pytest tests/ -q --cov=app --cov-fail-under=80
      - name: Frontend tests
        working-directory: frontend
        run: |
          py -3.13 -m pip install -e "../backend[dev]"
          npm ci
          npm run test:coverage
          npm run build
      - name: Launcher tests
        working-directory: launcher
        run: |
          go mod tidy
          go test ./... -coverprofile=coverage.out -covermode=atomic
          $line = go tool cover -func=coverage.out | Select-String "total:"
          if ($line -match "(\d+\.\d+)%") {
            $pct = [double]$Matches[1]
            if ($pct -lt 80) { throw "Launcher coverage ${pct}% below 80%" }
          }

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build release
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -SkipTests
      - name: Resolve artifact name
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -match '^refs/tags/v') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/v',''
            if ($tag -ne $version) { throw "Tag v$tag != pyproject version $version" }
            echo "name=TCGTools-$version-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -eq 'refs/heads/master') {
            echo "name=TCGTools-$version-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=false" >> $env:GITHUB_OUTPUT
          } else {
            $branch = $env:GITHUB_REF -replace 'refs/heads/','' -replace '/','-'
            $sha = $env:GITHUB_SHA.Substring(0,7)
            echo "name=TCGTools-$branch-$sha-setup.exe" >> $env:GITHUB_OUTPUT
            echo "is_release=false" >> $env:GITHUB_OUTPUT
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/TCGTools-*-setup.exe
      - name: GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TCGTools-*-setup.exe
          generate_release_notes: true
