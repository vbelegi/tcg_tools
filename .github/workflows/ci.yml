name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Backend tests
        shell: pwsh
        run: ./scripts/ci/run-backend-tests.ps1

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        shell: pwsh
        run: ./scripts/ci/run-frontend-tests.ps1

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Launcher tests
        shell: pwsh
        run: ./scripts/ci/run-launcher-tests.ps1

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pester + lockfile validation
        shell: pwsh
        run: |
          ./scripts/validate-prod-lock.ps1
          ./scripts/ci/run-pester-tests.ps1
